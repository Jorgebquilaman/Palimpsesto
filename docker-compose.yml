services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digesto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digesto_dev}
      POSTGRES_DB: ${POSTGRES_DB:-digesto}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digesto} -d ${POSTGRES_DB:-digesto}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      ConnectionStrings__Digesto: Host=postgres;Port=5432;Database=${POSTGRES_DB:-digesto};Username=${POSTGRES_USER:-digesto};Password=${POSTGRES_PASSWORD:-digesto_dev}
      Jwt__Clave: ${JWT_CLAVE:-clave_de_desarrollo_local_minimo_32_caracteres_x}
      FileStorage__Root: /data/archivos
      Ingesta__TamanioMaximoMb: ${INGESTA_TAMANIO_MAX_MB:-50}
      Ingesta__UmbralCaracteresPagina: ${INGESTA_UMBRAL_CARACTERES_PAGINA:-100}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5008:8080"
    volumes:
      - archivos:/data/archivos
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      ConnectionStrings__Digesto: Host=postgres;Port=5432;Database=${POSTGRES_DB:-digesto};Username=${POSTGRES_USER:-digesto};Password=${POSTGRES_PASSWORD:-digesto_dev}
      FileStorage__Root: /data/archivos
      Ingesta__TamanioMaximoMb: ${INGESTA_TAMANIO_MAX_MB:-50}
      Ingesta__UmbralCaracteresPagina: ${INGESTA_UMBRAL_CARACTERES_PAGINA:-100}
    volumes:
      - archivos:/data/archivos
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  archivos:
