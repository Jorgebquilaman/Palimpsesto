<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digesto Normativo IUPA</title>
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="apple-touch-icon" href="/logo-mark.svg" />
    <script>
      (function () {
        try {
          var tema = localStorage.getItem('digesto-tema')
          oscuro();
          function oscuro() {
            var modoOscuro = tema === 'oscuro'
            if (modoOscuro) {
              document.documentElement.classList.add('dark')
            }
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
